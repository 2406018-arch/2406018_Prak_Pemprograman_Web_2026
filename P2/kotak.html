<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 2 - Form Kotak</title>
</head>
<body>
    <header>
        <h1>Form Kotak</h1>
    </header>
    <hr>
    <main>
        <section>
            <h2>Kirimkan Pesan Atau Penawaran Projek</h2>
            <form>
                <p>
                <label for="nama_pengirim">nama lengkap anda:</label><br>
                <input type="text" id="nama_pengirim" name="nama_pengirim" required><br><br>
                 </p>
                    <p>
                    <label for="email_pengirim">Alamat Email:</label><br>
                    <input type="email" id="email_pengirim" name="email_pengirim" required><br><br>
                    </p>
                    <p>
                        <label for="jenis_layanan">Jenis Layanan yang dibutuhkan:</label><br>
                        <select id="jenis_layanan" name="jenis_layanan"></select>>
                            <option value="">Pilih Jenis Layanan</option>
                            <option value="web">pembuatan web</option>
                            <option value="app">Pengembangan Aplikasi</option>
                            <option value="other">Lain-lain</option>
                        </select>
                        <p>
                            <label for="pesan">Pesan:</label><br>
<textarea id="pesan" name="pesan" rows="6"
cols="50"></textarea>
</p>
 <p>
 <button type="submit">Kirim Pesan</button>
<button type="reset">Batal / Reset</button>
 </p>
 </form>
 </section>
 </main>
 <hr>
 <footer>
 <p>&copy; 2026 Teknik Informatika ITG</p>
 </footer>
</body>
</html>
